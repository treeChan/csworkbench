name: build-desktop

# 桌面 App (Tauri) 三平台构建。
# 触发:
#   - 推送 v* tag（正式渠道，如 v0.4.4）
#   - 推送 preview tag（预览渠道：滚动 tag，每次预览发布 force push 更新，
#     临时把版本号改为 0.4.4-preview.N，latest.json 里带完整版本号）
#   - 手动 workflow_dispatch
# 产物:draft Release + workflow artifacts。
on:
  push:
    tags: ["v*", "preview"]
  workflow_dispatch:

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS runner 近年为 arm64;如需 Intel Mac 包,再加 macos-13 一项。
          - platform: macos-latest
          - platform: windows-latest
          - platform: ubuntu-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./desktop/src-tauri -> target"

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libsoup-3.0-dev patchelf

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: desktop/sidecar/requirements-desktop.txt

      - name: Install Python deps + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/sidecar/requirements-desktop.txt
          pip install "pyinstaller>=6"

      - name: Build sidecar and rename with target triple
        shell: bash
        run: |
          cd desktop/sidecar
          python -m PyInstaller --clean --noconfirm workbench-server.spec
          TRIPLE=$(rustc -vV | grep '^host:' | awk '{print $2}')
          EXT=""
          if [ "$RUNNER_OS" = "Windows" ]; then EXT=".exe"; fi
          mkdir -p ../src-tauri/binaries
          cp "dist/workbench-server${EXT}" "../src-tauri/binaries/workbench-server-${TRIPLE}${EXT}"
          ls -la ../src-tauri/binaries/

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: npm ci
        working-directory: desktop
        run: npm ci

      # 版本号单一源同步：唯一真源是仓库根 VERSION 文件。
      # config.py 运行时直接读它；tauri.conf.json 已删 version 字段（回退 Cargo.toml）。
      # 构建前必须把 VERSION 同步到 Cargo.toml / package.json，保证产物版本号与 tag 一致。
      # （本地 `npm run tauri build` 由 package.json 的 pretauri hook 自动同步）
      - name: Sync version from VERSION file
        run: python scripts/sync_version.py

      # 图标已随仓库提交(src-tauri/icons/),无需在 CI 里重新生成。
      # 读取当前 release notes（docs/release-notes.md，单一文件、每次发布覆盖），
      # 作为 Release body + latest.json 的 notes 字段
      # （latest.json 的 notes 来自 releaseBody 参数；不设则更新弹窗里不展示更新日志）
      - name: Read release notes
        id: notes
        # 显式用 bash：Windows runner 默认是 PowerShell，`if [ -f ]` 这类 bash 语法会解析失败
        shell: bash
        run: |
          FILE="docs/release-notes.md"
          if [ -f "$FILE" ]; then
            # 确保文件以换行结尾：否则 cat 的内容会与下方 "EOF" 分隔符粘成一行，
            # GITHUB_OUTPUT 解析不到独立 EOF 行 → "Matching delimiter not found" 报错
            [ -z "$(tail -c1 "$FILE")" ] || printf '\n' >> "$FILE"
            # 分隔符用固定长串，避免 release notes 正文里恰好出现独立 "EOF" 行导致提前截断
            DELIM="CSWB_RELEASE_BODY_EOF"
            {
              echo "releaseBody<<${DELIM}"
              cat "$FILE"
              echo "${DELIM}"
            } >> "$GITHUB_OUTPUT"
            echo "Read $FILE as release notes"
          else
            echo "WARN: $FILE not found, release will have no update log"
          fi

      - name: Build Tauri app (bundle + upload)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # updater 签名密钥:由 `npm run tauri signer generate` 生成,私钥存 GitHub Secrets
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS 签名/公证(可选,预留接口):APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD /
          #   APPLE_SIGNING_IDENTITY / APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
          # Windows 代码签名(可选):WINDOWS_CERTIFICATE / WINDOWS_CERTIFICATE_PASSWORD
        with:
          projectPath: ./desktop
          tagName: ${{ github.ref_name }}
          releaseName: "csworkbench ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.releaseBody }}
          # preview tag 发布为 pre-release（正式渠道 /releases/latest 自动排除它）
          prerelease: ${{ !startsWith(github.ref_name, 'v') }}
          releaseDraft: true
          # v0 tauri-action 参数名：上传 updater 的 latest.json（包含签名）
          includeUpdaterJson: true
          # 同时把安装包作为 workflow artifacts 留存（构建产物可见）
          uploadPlainBinary: true

      # 预览渠道清理：tag 固定 → 同一 Release 每次构建都上传新安装包。
      # 安装包文件名带版本号，旧版本文件不会被 tauri-action 清理，会越积越多
      # （单 Release assets 上限 2GB）。构建成功后删掉所有「非当前版本号」的 assets，
      # 只保留 updater 清单（latest.json 及其签名）与本次构建的安装包。
      # 三平台并行都跑本步骤：删除的都是历史版本文件（同名 id 404 忽略），
      # 当前版本文件含 VERSION 版本号 → 全部保留，不会误删。
      - name: Clean stale preview assets
        shell: bash
        if: github.ref_name == 'preview'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(cat VERSION)
          REPO="$GITHUB_REPOSITORY"
          gh api "repos/$REPO/releases/tags/preview" \
            --jq '.assets[] | "\(.id)\t\(.name)"' 2>/dev/null | while IFS=$'\t' read -r id name; do
            [ -z "$name" ] && continue
            case "$name" in
              latest.json*|*.sig)          # updater 清单与签名：永远保留
                echo "keep updater asset: $name" ;;
              *"$VER"*)                     # 本次构建版本（三平台）：保留
                echo "keep current asset: $name" ;;
              *)                            # 历史版本安装包：删除
                echo "delete stale asset: $name"
                gh api -X DELETE "repos/$REPO/releases/assets/$id" >/dev/null 2>&1 \
                  || echo "  (ignore delete failure)"
                ;;
            esac
          done
